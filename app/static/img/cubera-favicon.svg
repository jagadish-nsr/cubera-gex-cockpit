<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
  </defs>
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#0b0f19" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Isometric Cube Lines -->
  <!-- Top Face -->
  <polygon points="32,10 52,22 32,34 12,22"
           fill="url(#favGrad)"
           fill-opacity="0.2"
           stroke="url(#favGrad)"
           stroke-width="2.2"
           stroke-linejoin="round" />

  <!-- Left Face -->
  <polygon points="12,22 32,34 32,54 12,42"
           fill="#00f2fe"
           fill-opacity="0.1"
           stroke="url(#favGrad)"
           stroke-width="2.2"
           stroke-linejoin="round" />

  <!-- Right Face -->
  <polygon points="32,34 52,22 52,42 32,54"
           fill="#00e676"
           fill-opacity="0.1"
           stroke="url(#favGrad)"
           stroke-width="2.2"
           stroke-linejoin="round" />

  <!-- Gamma Vertex Spark -->
  <circle cx="32" cy="34" r="3" fill="#ffffff" />
  <circle cx="32" cy="10" r="2.2" fill="#00f2fe" />
  <circle cx="52" cy="22" r="2.2" fill="#00e676" />
  <circle cx="12" cy="22" r="2.2" fill="#00f2fe" />
  <circle cx="32" cy="54" r="2.2" fill="#00e676" />
</svg>
