<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for container / emblem -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Cyan to Mint Gamma Gradient -->
    <linearGradient id="gammaCyanMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <!-- Call / Positive Gamma Accent -->
    <linearGradient id="callGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#69f0ae" />
    </linearGradient>

    <!-- Put / Resistance Accent -->
    <linearGradient id="putGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#ff7b90" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Isometric Cube Structure (Cubera) -->
  <!-- Top Face -->
  <polygon points="60,16 98,38 60,60 22,38"
           fill="url(#gammaCyanMint)"
           fill-opacity="0.12"
           stroke="url(#gammaCyanMint)"
           stroke-width="2.5"
           stroke-linejoin="round" />

  <!-- Left Face -->
  <polygon points="22,38 60,60 60,104 22,82"
           fill="#00f2fe"
           fill-opacity="0.06"
           stroke="url(#gammaCyanMint)"
           stroke-width="2.5"
           stroke-linejoin="round" />

  <!-- Right Face -->
  <polygon points="60,60 98,38 98,82 60,104"
           fill="#00e676"
           fill-opacity="0.06"
           stroke="url(#gammaCyanMint)"
           stroke-width="2.5"
           stroke-linejoin="round" />

  <!-- Central Dynamic Gamma Energy Core (Inner Hypercube / Tensor Lattice) -->
  <polygon points="60,34 82,47 60,60 38,47"
           fill="none"
           stroke="#38bdf8"
           stroke-width="1.5"
           stroke-dasharray="3,2"
           opacity="0.75" />

  <!-- Gamma 'Γ' Vector Curve / Volatility Arc -->
  <path d="M 32,58 Q 60,32 88,48 T 60,96"
        fill="none"
        stroke="url(#gammaCyanMint)"
        stroke-width="3"
        stroke-linecap="round"
        filter="url(#neonGlow)" />

  <!-- Vertical Axis / Pinning Center -->
  <line x1="60" y1="20" x2="60" y2="100"
        stroke="#ffffff"
        stroke-width="1.8"
        stroke-linecap="round"
        opacity="0.85"
        filter="url(#softGlow)" />

  <!-- Strategic GEX Coordinate Vertices (Precision Telemetry Nodes) -->
  <circle cx="60" cy="16" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="98" cy="38" r="3" fill="#00e676" filter="url(#softGlow)" />
  <circle cx="22" cy="38" r="3" fill="#00f2fe" filter="url(#softGlow)" />
  <circle cx="60" cy="60" r="4.5" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="22" cy="82" r="3" fill="#00f2fe" filter="url(#softGlow)" />
  <circle cx="98" cy="82" r="3" fill="#00e676" filter="url(#softGlow)" />
  <circle cx="60" cy="104" r="3.5" fill="#00e676" filter="url(#softGlow)" />
</svg>
