<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="100%" height="100%">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark (40x40 scale centered at x=24, y=24) -->
  <g transform="translate(4, 4)">
    <!-- Top Face -->
    <polygon points="20,5 34,13 20,21 6,13"
             fill="url(#markGrad)"
             fill-opacity="0.18"
             stroke="url(#markGrad)"
             stroke-width="1.6"
             stroke-linejoin="round" />

    <!-- Left Face -->
    <polygon points="6,13 20,21 20,35 6,27"
             fill="#00f2fe"
             fill-opacity="0.08"
             stroke="url(#markGrad)"
             stroke-width="1.6"
             stroke-linejoin="round" />

    <!-- Right Face -->
    <polygon points="20,21 34,13 34,27 20,35"
             fill="#00e676"
             fill-opacity="0.08"
             stroke="url(#markGrad)"
             stroke-width="1.6"
             stroke-linejoin="round" />

    <!-- Core Crosshair / Energy Center -->
    <line x1="20" y1="7" x2="20" y2="33" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="21" r="2.4" fill="#ffffff" filter="url(#markGlow)" />
    <circle cx="20" cy="5" r="1.6" fill="#00f2fe" />
    <circle cx="34" cy="13" r="1.6" fill="#00e676" />
    <circle cx="6" cy="13" r="1.6" fill="#00f2fe" />
    <circle cx="20" cy="35" r="1.6" fill="#00e676" />
  </g>

  <!-- Typography: CUBERA -->
  <text x="52" y="27"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
        font-size="19"
        font-weight="800"
        letter-spacing="0.06em"
        fill="url(#textGrad)">CUBERA</text>

  <!-- GEX Pill Badge -->
  <rect x="156" y="11" width="48" height="22" rx="5"
        fill="rgba(0, 242, 254, 0.12)"
        stroke="url(#badgeGrad)"
        stroke-width="1.2" />

  <text x="180" y="27"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', monospace"
        font-size="12"
        font-weight="900"
        letter-spacing="0.08em"
        fill="#00f2fe">GEX</text>

  <!-- Subtitle Tagline: COCKPIT -->
  <text x="214" y="26"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="9.5"
        font-weight="700"
        letter-spacing="0.16em"
        fill="#64748b">COCKPIT</text>
</svg>
