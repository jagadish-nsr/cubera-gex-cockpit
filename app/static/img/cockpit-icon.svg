<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="cockpitCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <filter id="cockpitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#0b0f19"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(0,242,254,0.3)" stroke-width="1.2"/>

  <!-- Radar sweep rings -->
  <circle cx="32" cy="32" r="22" stroke="url(#cockpitCoreGrad)" stroke-width="1.8" stroke-dasharray="4 2.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="14" stroke="url(#cockpitCoreGrad)" stroke-width="1.5" opacity="0.85"/>
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" filter="url(#cockpitGlow)"/>

  <!-- Tactical crosshairs -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="58" stroke="#00e676" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="14" y2="32" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="58" y2="32" stroke="#00e676" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Artificial Horizon / Pitch Vector -->
  <path d="M18 32H25M39 32H46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24 40L28 35L32 37L36 35L40 40" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
