# CryptoCubera foundation config
# Providers are plugged in by name; enable/priority control selection.
# Feature flags gate UI slices and live feeds (restart or PATCH /api/flags).

underlying: BTC
currency: USD
mode: advisory  # advisory | confirm | auto (confirm/auto disabled until wired)

database:
  url: sqlite:///./data/crypto/cubera.db

providers:
  option_chain:
    # Lower priority number wins when multiple flags are on.
    - name: deribit
      enabled: true
      priority: 5
      feature_flag: feeds.deribit
      credentials_ref: DERIBIT_CLIENT_ID
      rate_limits:
        rest_per_min: 60
    - name: delta
      enabled: true
      priority: 6
      feature_flag: feeds.delta
      rate_limits:
        rest_units_per_5min: 20000
    - name: mock
      enabled: true
      priority: 50
      feature_flag: feeds.mock

  perp:
    - name: deribit
      enabled: true
      priority: 5
      feature_flag: feeds.deribit
    - name: binance
      enabled: false
      priority: 20
      feature_flag: feeds.perp_binance
    - name: mock
      enabled: true
      priority: 50
      feature_flag: feeds.mock

  news:
    - name: mock
      enabled: true
      priority: 10
      feature_flag: intel.news
    - name: cryptopanic
      enabled: false
      priority: 20
      feature_flag: intel.news
      credentials_ref: CRYPTOPANIC_TOKEN

  execution:
    - name: mock
      enabled: true
      priority: 10
      feature_flag: exec.paper
    - name: delta
      enabled: false
      priority: 20
      feature_flag: exec.paper

feature_flags:
  feeds.mock: true
  feeds.deribit: false
  feeds.delta: false
  feeds.perp_binance: false
  engine.gex_flow_model: true
  engine.signal_rules: true
  intel.news: true
  ui.gex_map: true
  ui.go_cards: true
  ui.regime_strip: true
  ui.operator_panel: true
  exec.paper: false
  exec.confirm: false

# Live feed collectors (Phase 0). Off by default; also require CRYPTO_LIVE_FEEDS=1
# (or live_spike.* below) so mock remains the quiet default.
feeds:
  stale_threshold_s: 2.0
  deribit:
    ws_url: wss://www.deribit.com/ws/api/v2
    rest_url: https://www.deribit.com/api/v2
    max_expiries: 2
    strike_band_pct: 0.08
  delta:
    ws_url: wss://public-socket.india.delta.exchange
    rest_url: https://api.india.delta.exchange
    symbols: [BTCUSD]
    snapshot_options: true

# Optional live spike. Never blocks the UI.
live_spike:
  deribit_ticker: false
  deribit_ws: false
  delta_ws: false
  deribit_base_url: https://www.deribit.com/api/v2
