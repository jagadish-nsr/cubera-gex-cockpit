name: Cubera GEX CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Test Suite & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Web Server Endpoint Integration Tests
        run: |
          python -m pytest -v tests/test_web_server_endpoints.py

      - name: Run Core Quant & Parity Tests
        run: |
          python -m pytest -v tests/test_cockpit_market_hours.py tests/test_universal_ist_timestamps.py tests/test_pricer.py
